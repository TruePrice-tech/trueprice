name: Weekly Redis Backup

# Snapshots all flywheel-critical Upstash keys to a JSON file and stores it
# as a workflow artifact (90-day retention). Single point of failure today is
# Upstash — if the database is wiped or corrupted, we lose tp:total_quotes,
# every cal:* bucket, and all calibration history. Cheap insurance.
#
# Restore path: download the latest artifact, run scripts/restore-redis.js
# (write that when needed — not a tested code path until disaster strikes).

on:
  schedule:
    - cron: '0 4 * * 0'  # Sunday 04:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Upstash client
        run: npm install --no-save @upstash/redis@1.37.0

      - name: Snapshot Redis
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          node <<'EOF'
          import fs from 'node:fs';
          import { Redis } from '@upstash/redis';
          const redis = Redis.fromEnv();

          // Match patterns we want to back up. Skip per-quote and rate-limit
          // keys (huge volume, regenerable) and ephemeral session keys.
          const PATTERNS = [
            'tp:total_quotes',
            'tp:real_quote_count',
            'tp:counter_history',
            'tp:cron_run:*',
            'tp:drift_history:*',
            'tp:drift_report:*',
            'tp:price_event:*',
            'tp:price_event_active',
            'tp:vertical_health:*',
            'tp:flywheel_integrity:*',
            'cal:*',
          ];

          // Read a key by its actual Redis type. The literal-key branch used to
          // assume 'string' and call get() unconditionally, which threw
          // WRONGTYPE on tp:counter_history (list) and tp:price_event_active
          // (set) and aborted the whole backup before a single key was written.
          async function readKey(k) {
            const type = await redis.type(k);
            if (type === 'string') return { type, value: await redis.get(k) };
            if (type === 'list') return { type, value: await redis.lrange(k, 0, -1) };
            if (type === 'set') return { type, value: await redis.smembers(k) };
            if (type === 'hash') return { type, value: await redis.hgetall(k) };
            if (type === 'zset') return { type, value: await redis.zrange(k, 0, -1, { withScores: true }) };
            return null; // 'none' (missing) or an unsupported type
          }

          const snapshot = {};
          let totalKeys = 0;
          const skipped = [];

          for (const pattern of PATTERNS) {
            if (!pattern.includes('*')) {
              const entry = await readKey(pattern);
              if (entry && entry.value !== null && entry.value !== undefined) {
                snapshot[pattern] = entry;
                totalKeys++;
              } else {
                skipped.push(pattern);
              }
              continue;
            }
            let cursor = 0;
            do {
              const [next, batch] = await redis.scan(cursor, { match: pattern, count: 500 });
              cursor = Number(next);
              for (const k of batch) {
                const entry = await readKey(k);
                if (!entry) { skipped.push(k); continue; }
                snapshot[k] = entry;
                totalKeys++;
              }
            } while (cursor !== 0);
          }

          const date = new Date().toISOString().substring(0, 10);
          const out = { date, totalKeys, patterns: PATTERNS, skipped, data: snapshot };
          fs.mkdirSync('backup', { recursive: true });
          fs.writeFileSync(`backup/redis-${date}.json`, JSON.stringify(out));
          console.log(`Backed up ${totalKeys} keys (${(fs.statSync(`backup/redis-${date}.json`).size / 1024).toFixed(1)} KB)`);
          if (skipped.length) console.log(`Skipped ${skipped.length} missing/unsupported: ${skipped.slice(0, 20).join(', ')}`);

          // A backup that silently captures nothing is worse than a red build.
          if (totalKeys === 0) {
            console.error('FAIL: snapshot is empty. Refusing to upload a useless artifact.');
            process.exit(1);
          }
          EOF

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: redis-backup-${{ github.run_id }}
          path: backup/*.json
          retention-days: 90
